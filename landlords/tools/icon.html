<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const q = new URLSearchParams(location.search);
  const size = Number(q.get('size') || 512);
  const mode = q.get('mode') || 'any';
  const NAVY = '#12214a';
  const RADIUS = 156 / 1024;
  const c = document.getElementById('c');
  c.width = size;
  c.height = size;
  const g = c.getContext('2d');
  const img = new Image();
  img.onload = () => {
    const scale = mode === 'mask' ? 0.74 : mode === 'apple' ? 0.92 : 1;
    if (mode !== 'any') {
      g.fillStyle = NAVY;
      g.fillRect(0, 0, size, size);
    }
    const s = size * scale;
    const o = (size - s) / 2;
    const inset = s * ((mode === 'any' ? 2 : 22) / 1024);
    g.save();
    g.beginPath();
    g.roundRect(o + inset, o + inset, s - inset * 2, s - inset * 2, s * RADIUS);
    g.clip();
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, o, o, s, s);
    g.restore();
    document.title = 'ready';
  };
  img.src = 'icon-source.png';
</script>
</body>
</html>
