<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Fredoka:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #box { width: 100vw; height: 100vh; }
    #box svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="box"></div>
  <script type="module">
    import { logo } from '../shared/logos.js';
    const q = new URLSearchParams(location.search);
    const mode = q.get('mode') || 'any';
    document.getElementById('box').innerHTML = logo(q.get('game'), { text: mode === 'logo', bleed: mode === 'mask' || mode === 'apple' });
    document.fonts.ready.then(() => requestAnimationFrame(() => { document.title = 'ready'; }));
  </script>
</body>
</html>
